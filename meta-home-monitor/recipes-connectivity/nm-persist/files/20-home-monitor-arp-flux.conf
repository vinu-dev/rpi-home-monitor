# REQ: SWR-050; RISK: RISK-018; SEC: SC-019; TEST: TC-044
# Avoid ARP flux when server Ethernet and WiFi are both on the same LAN.
# The server advertises one canonical LAN identity; the kernel should answer
# ARP consistently with the interface that owns the route.
net.ipv4.conf.all.arp_filter = 1
net.ipv4.conf.default.arp_filter = 1
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
