# REQ: SWR-001, SWR-034, SWR-046; RISK: RISK-002, RISK-019; SEC: SC-001, SC-017, SC-018; TEST: TC-032, TC-043
# Baked image trust anchor for local/offline client certificate login.
# The certificate file is generated/staged locally before Yocto builds and is
# not committed to git.
ssl_client_certificate /etc/home-monitor/trust/home-monitor-provisioning-ca.crt;
# Do not let nginx reject camera mTLS requests that use the product camera CA.
# Flask validates provisioning-login certificates against this CA before
# creating a GUI session.
ssl_verify_client optional_no_ca;
ssl_verify_depth 2;
