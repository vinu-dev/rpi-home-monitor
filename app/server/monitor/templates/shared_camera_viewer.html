<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ resource_name }} - Shared Camera</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="public-share-body">
    <main class="public-share-shell">
        <section class="public-share-card">
            <div class="public-share-header">
                <img class="public-share-logo"
                     src="{{ url_for('static', filename='images/logo.svg') }}"
                     alt="Home Monitor">
                <div>
                    <p class="public-share-kicker">Shared live camera</p>
                    <h1 class="public-share-title">{{ resource_name }}</h1>
                </div>
            </div>
            <div class="public-share-player" id="share-live-frame">
                <video class="public-share-video" id="share-live-video" autoplay muted playsinline></video>
                <div class="public-share-watermark">
                    Shared by {{ device_name }}
                </div>
                <div class="public-share-overlay" id="share-live-overlay">Loading stream...</div>
            </div>
        </section>
    </main>

    <script>
    (function() {
        var videoEl = document.getElementById('share-live-video');
        var overlayEl = document.getElementById('share-live-overlay');
        var whepUrl = {{ whep_url|tojson }};
        var peerConnection = null;
        var WHEP_TIMEOUT_MS = 8000;

        function setOverlay(text) {
            overlayEl.textContent = text;
            overlayEl.style.display = '';
        }

        function hideOverlay() {
            overlayEl.style.display = 'none';
        }

        function waitForICE(pc, maxWait) {
            return new Promise(function(resolve) {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                    return;
                }
                var done = false;
                var timer = setTimeout(function() {
                    if (!done) {
                        done = true;
                        resolve();
                    }
                }, maxWait);
                pc.onicegatheringstatechange = function() {
                    if (pc.iceGatheringState === 'complete' && !done) {
                        done = true;
                        clearTimeout(timer);
                        resolve();
                    }
                };
            });
        }

        function startWebRTC() {
            if (typeof RTCPeerConnection === 'undefined') {
                setOverlay('Live playback is not supported in this browser');
                return;
            }

            setOverlay('Starting stream...');
            var pc = new RTCPeerConnection({ iceServers: [] });
            peerConnection = pc;

            var timeout = setTimeout(function() {
                if (peerConnection === pc) {
                    pc.close();
                    peerConnection = null;
                    setOverlay('Stream unavailable');
                }
            }, WHEP_TIMEOUT_MS);

            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            pc.ontrack = function(event) {
                if (event.streams && event.streams[0]) {
                    clearTimeout(timeout);
                    videoEl.srcObject = event.streams[0];
                    videoEl.play().catch(function() {});
                    hideOverlay();
                }
            };

            pc.onconnectionstatechange = function() {
                if (pc.connectionState === 'failed' ||
                    pc.connectionState === 'disconnected') {
                    clearTimeout(timeout);
                    setOverlay('Stream unavailable');
                }
            };

            pc.createOffer().then(function(offer) {
                return pc.setLocalDescription(offer);
            }).then(function() {
                return waitForICE(pc, 2000);
            }).then(function() {
                return fetch(whepUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: pc.localDescription.sdp
                });
            }).then(function(response) {
                if (!response.ok) {
                    throw new Error('WHEP POST failed: ' + response.status);
                }
                return response.text();
            }).then(function(sdpAnswer) {
                return pc.setRemoteDescription(
                    new RTCSessionDescription({ type: 'answer', sdp: sdpAnswer })
                );
            }).catch(function() {
                clearTimeout(timeout);
                if (peerConnection === pc) {
                    peerConnection = null;
                }
                pc.close();
                setOverlay('Stream unavailable');
            });
        }

        window.addEventListener('pagehide', function() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
        });

        startWebRTC();
    })();
    </script>
</body>
</html>
