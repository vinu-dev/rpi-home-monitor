<!-- REQ: SWR-013; RISK: RISK-002; SEC: SC-001; TEST: TC-004 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>Camera Login</title>
<style>
:root {
    --color-bg: #0a0a1a;
    --color-surface: #1a1a2e;
    --color-surface-alt: #16213e;
    --color-border: #2a2a3e;
    --color-text: #eee;
    --color-text-muted: #999;
    --color-accent: #e94560;
    --color-accent-hover: #c73a52;
    --color-danger: #e74c3c;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.login-card {
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    padding: 32px 24px;
    width: 100%;
    max-width: 380px;
    border: 1px solid var(--color-border);
}
.login-card__logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 6px;
}
.login-card__title {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--color-accent);
}
.login-card__subtitle {
    text-align: center;
    font-size: 0.85rem;
    color: var(--color-text-muted);
    margin-bottom: 24px;
}
.form-group { margin-bottom: 14px; }
.form-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--color-text-muted);
    margin-bottom: 6px;
}
.form-input {
    width: 100%;
    padding: 12px;
    background: var(--color-surface-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    color: var(--color-text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
}
.form-input:focus { border-color: var(--color-accent); }
.btn {
    display: block;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    background: var(--color-accent);
    color: #fff;
    transition: background 0.2s;
}
.btn:hover { background: var(--color-accent-hover); }
.error {
    background: rgba(231, 76, 60, 0.15);
    border: 1px solid var(--color-danger);
    color: var(--color-danger);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    margin-bottom: 14px;
    text-align: center;
}
.hint {
    color: var(--color-text-muted);
    font-size: 0.8rem;
    text-align: center;
    margin-top: 16px;
}

/* Camera login matches the server control-panel visual language. */
:root {
    --color-bg: #f4f7fb;
    --color-surface: rgba(255,255,255,.92);
    --color-surface-alt: rgba(255,255,255,.9);
    --color-border: rgba(15,23,42,.12);
    --color-text: #111827;
    --color-text-muted: #64748b;
    --color-accent: #2563eb;
    --color-accent-hover: #1d4ed8;
    --color-danger: #dc2626;
    --radius-sm: 14px;
    --radius-md: 18px;
    --radius-lg: 24px;
}
body {
    background:
        linear-gradient(116deg, rgba(37,99,235,.16) 0%, rgba(37,99,235,0) 38%),
        linear-gradient(302deg, rgba(20,184,166,.12) 0%, rgba(20,184,166,0) 42%),
        linear-gradient(180deg, #f8fafc, var(--color-bg));
}
.login-card {
    box-shadow: 0 22px 55px rgba(15,23,42,.12);
}
.login-card__title {
    color: var(--color-text);
}
.login-card__logo svg {
    stroke: var(--color-accent);
}
.form-group label {
    font-weight: 650;
}
.form-input {
    box-shadow: inset 0 1px 0 rgba(15,23,42,.03);
}
.form-input:focus {
    box-shadow: 0 0 0 4px rgba(37,99,235,.13);
}
.btn {
    border-radius: 999px;
    background: linear-gradient(180deg, #3b82f6, var(--color-accent));
    box-shadow: 0 1px 2px rgba(15,23,42,.08);
}
.btn:hover {
    background: linear-gradient(180deg, #2563eb, var(--color-accent-hover));
}
.error {
    background: #fee2e2;
    border-color: rgba(220,38,38,.24);
    color: #991b1b;
}

/* Aurora login pass: shared premium camera/server visual language. */
:root {
    --color-bg: #edf4fb;
    --color-surface: rgba(255,255,255,.86);
    --color-surface-alt: rgba(247,250,254,.78);
    --color-border: rgba(20,35,61,.13);
    --color-text: #111827;
    --color-text-muted: #60708a;
    --color-accent: #0a84ff;
    --color-accent-hover: #006ee0;
    --color-danger: #df2f3f;
}

html {
    background: #edf4fb;
}

body {
    color: var(--color-text);
    background:
        linear-gradient(116deg, rgba(10,132,255,.15) 0%, rgba(10,132,255,0) 38%),
        linear-gradient(302deg, rgba(0,199,190,.16) 0%, rgba(0,199,190,0) 42%),
        linear-gradient(180deg, #fbfdff 0%, #edf4fb 56%, #e8f1fa 100%);
}

.login-card {
    width: min(92vw, 420px);
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(247,250,254,.76));
    border: 1px solid var(--color-border);
    border-radius: 32px;
    padding: 34px;
    box-shadow: 0 32px 90px rgba(28,50,87,.18), 0 1px 0 rgba(255,255,255,.9) inset;
}

.login-card__logo {
    gap: 12px;
}

.login-card__logo svg {
    width: 36px;
    height: 36px;
    padding: 8px;
    border-radius: 14px;
    stroke: #fff;
    background: linear-gradient(135deg, #0a84ff 0%, #00c7be 52%, #7d5cff 100%);
    box-shadow: 0 16px 34px rgba(10,132,255,.24), 0 1px 0 rgba(255,255,255,.55) inset;
}

.login-card__title {
    color: #07111f;
    font-weight: 820;
}

.login-card__subtitle,
.hint,
.form-group label {
    color: var(--color-text-muted);
}

.form-input {
    min-height: 50px;
    background: rgba(255,255,255,.88);
    border: 1px solid rgba(20,35,61,.14);
    border-radius: 17px;
    color: var(--color-text);
    box-shadow: 0 1px 0 rgba(255,255,255,.88) inset;
}

.form-input:focus {
    border-color: rgba(10,132,255,.62);
    box-shadow: 0 0 0 4px rgba(10,132,255,.14);
}

.btn {
    min-height: 50px;
    border-radius: 999px;
    background: linear-gradient(135deg, #0a84ff 0%, #00c7be 52%, #7d5cff 100%);
    font-weight: 780;
    box-shadow: 0 1px 0 rgba(255,255,255,.65) inset, 0 16px 34px rgba(10,132,255,.2);
}

.btn:hover {
    background: linear-gradient(135deg, #0077ea 0%, #00b7af 52%, #6f4ff0 100%);
}

.error {
    background: #fff0f2;
    border-color: rgba(223,47,63,.24);
    color: #a81729;
    border-radius: 18px;
}

@media (max-width: 520px) {
    body {
        padding: 18px;
    }

    .login-card {
        padding: 26px;
        border-radius: 28px;
    }
}

/* Camera login parity pass: same premium surface treatment as setup and
   status, while preserving the simple POST login flow. */
.login-card {
    position: relative;
    overflow: hidden;
}

.login-card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 3px;
    background: linear-gradient(90deg, #0a84ff, #00c7be, #7d5cff);
}

.form-group {
    padding: 12px;
    border: 1px solid rgba(20,35,61,.07);
    border-radius: 20px;
    background: rgba(255,255,255,.42);
}

.form-group + .form-group {
    margin-top: 12px;
}

.form-group label {
    font-weight: 720;
}
</style>
</head>
<body>
<div class="login-card">
    <div class="login-card__logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#e94560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
        </svg>
        <span class="login-card__title">Camera</span>
    </div>
    <p class="login-card__subtitle">{{CAMERA_ID}}</p>
    <div class="error" style="display:{{ERROR_DISPLAY}}">{{ERROR}}</div>
    <form method="POST" action="/login">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-input"
                   placeholder="admin" autofocus required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-input"
                   placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
    <p class="hint">Credentials were set during camera setup.</p>
</div>
</body>
</html>
